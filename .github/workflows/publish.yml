name: Check and Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - run: cargo verify

  build:
    needs: check
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: jsonr-linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: jsonr-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: jsonr-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: jsonr-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          # Rust links x86_64 musl binaries as static-pie, but aarch64 ones at a fixed address
          # (ET_EXEC). Termux runs programs through Android's linker64, which only loads
          # position-independent executables ("unexpected e_type: 2"), so link the aarch64
          # binary as static-pie: musl-gcc adds musl's self-relocating rcrt1.o, and Rust's
          # self-contained folder still provides libunwind.a and libc.a.
          if [ "${{ matrix.target }}" = aarch64-unknown-linux-musl ]; then
            self_contained="$(rustc --print sysroot)/lib/rustlib/${{ matrix.target }}/lib/self-contained"
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS="-C link-self-contained=no -L native=${self_contained} -C link-arg=-static-pie"
          fi
          cargo build --release --locked --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/jsonr ${{ matrix.asset }}
          if [ "${{ runner.os }}" = Linux ]; then
            file ${{ matrix.asset }}
            file ${{ matrix.asset }} | grep -q 'static-pie linked' || { echo "${{ matrix.asset }} is not static-pie"; exit 1; }
            ./${{ matrix.asset }} --version
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Get version from Cargo.toml
        id: version
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            dist/jsonr-linux-x64
            dist/jsonr-linux-arm64
            dist/jsonr-macos-x64
            dist/jsonr-macos-arm64
